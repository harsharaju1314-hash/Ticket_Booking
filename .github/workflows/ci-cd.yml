name: EventFlow Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: 🧪 Java Build & Concurrency Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit & Concurrency Tests
        run: mvn clean test -B

  security-scan:
    name: 🛡️ Trivy Container Vulnerability Scan
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Docker Image Locally
        run: docker build -t eventflow-backend:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'eventflow-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-eks:
    name: ☸️ AWS EKS Zero-Downtime Deployment
    needs: [test-and-lint, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Validate & Deploy Kubernetes Manifests
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "ℹ️ AWS Secrets not set on repo. Executing K8s manifest validation dry-run..."
            kubectl apply --dry-run=client -f k8s/configmap.yaml
            kubectl apply --dry-run=client -f k8s/secret.yaml
            kubectl apply --dry-run=client -f k8s/deployment.yaml
            kubectl apply --dry-run=client -f k8s/hpa.yaml
            kubectl apply --dry-run=client -f k8s/service.yaml
            echo "✅ Kubernetes Manifests Validated Successfully (0 Errors)"
          else
            echo "🚀 AWS Credentials detected. Deploying to Amazon EKS Cluster..."
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set default.region us-east-1
            aws eks update-kubeconfig --region us-east-1 --name eventflow-eks-cluster
            kubectl apply -f k8s/configmap.yaml
            kubectl apply -f k8s/secret.yaml
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/hpa.yaml
            kubectl apply -f k8s/service.yaml
            kubectl rollout status deployment/eventflow-backend --timeout=180s
          fi
